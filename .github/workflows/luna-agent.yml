name: Luna temporary cloud runner

on:
  workflow_dispatch:
    inputs:
      taskId:
        description: Active Luna relay task ID
        required: true
        type: string

concurrency:
  group: luna-cloud-runner
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  edit:
    if: github.repository == 'Rob-Keys/SweetHopeBakeryy-JS' && inputs.taskId != ''
    runs-on: ubuntu-slim
    timeout-minutes: 15
    outputs:
      kv_changes: ${{ steps.run-luna.outputs.kv_changes }}
    environment: luna-trace
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the dispatched main revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.LUNA_GITHUB_PUSH_TOKEN }}

      - name: Record workflow run for task diagnostics
        env:
          CODEX_AGENT_RELAY_TOKEN: ${{ secrets.CODEX_AGENT_RELAY_TOKEN }}
          CODEX_AGENT_RELAY_URL: ${{ vars.CODEX_AGENT_RELAY_URL }}
          INPUT_TASK_ID: ${{ inputs.taskId }}
        run: node scripts/report-luna-run.mjs

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Install locked private trace uploader dependency
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install headless Chromium for Luna visual previews
        run: npx playwright install --with-deps --only-shell chromium

      - name: Install pinned Codex CLI
        run: npm install --global @openai/codex@0.162.1

      - name: Run Luna
        id: run-luna
        env:
          CODEX_AGENT_RELAY_TOKEN: ${{ secrets.CODEX_AGENT_RELAY_TOKEN }}
          CODEX_AGENT_RELAY_URL: ${{ vars.CODEX_AGENT_RELAY_URL }}
          INPUT_TASK_ID: ${{ inputs.taskId }}
          LUNA_TRACE_AWS_REGION: ${{ vars.LUNA_TRACE_AWS_REGION }}
          LUNA_TRACE_AWS_ROLE_ARN: ${{ vars.LUNA_TRACE_AWS_ROLE_ARN }}
        run: node scripts/codex-cloud-agent.mjs

      - name: Upload KV change artifact
        if: steps.run-luna.outputs.kv_changes == 'true'
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: luna-${{ inputs.taskId }}
          path: ${{ runner.temp }}/luna-${{ inputs.taskId }}/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: edit
    if: needs.edit.result == 'success' && needs.edit.outputs.kv_changes == 'true'
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out trusted publisher code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: refs/heads/main
          persist-credentials: false

      - name: Download edit artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: luna-${{ inputs.taskId }}
          path: ${{ runner.temp }}/luna-artifact

      - name: Validate and publish
        env:
          CODEX_AGENT_RELAY_TOKEN: ${{ secrets.CODEX_AGENT_RELAY_TOKEN }}
          CODEX_AGENT_RELAY_URL: ${{ vars.CODEX_AGENT_RELAY_URL }}
          LUNA_CLOUDFLARE_API_TOKEN: ${{ secrets.LUNA_CLOUDFLARE_API_TOKEN }}
          LUNA_CLOUDFLARE_ACCOUNT_ID: ${{ vars.LUNA_CLOUDFLARE_ACCOUNT_ID }}
          LUNA_CLOUDFLARE_KV_NAMESPACE_ID: ${{ vars.LUNA_CLOUDFLARE_KV_NAMESPACE_ID }}
          LUNA_CLOUDFLARE_ZONE_ID: ${{ vars.LUNA_CLOUDFLARE_ZONE_ID }}
          INPUT_TASK_ID: ${{ inputs.taskId }}
          LUNA_ARTIFACT_DIR: ${{ runner.temp }}/luna-artifact
        run: node scripts/publish-luna-cloud.mjs
