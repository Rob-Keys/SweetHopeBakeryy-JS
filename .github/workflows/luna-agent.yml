name: Luna temporary cloud runner

on:
  workflow_dispatch:
    inputs:
      taskId:
        description: Active Luna relay task ID
        required: true
        type: string

concurrency:
  group: luna-cloud-runner
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  edit:
    if: github.repository == 'Rob-Keys/SweetHopeBakeryy-JS' && inputs.taskId != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: luna-cli
      deployment: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the dispatched main revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.LUNA_GITHUB_PUSH_TOKEN }}

      - name: Set up Node.js for the native WebSocket runner
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Record workflow run for task diagnostics
        env:
          CODEX_AGENT_RELAY_TOKEN: ${{ secrets.CODEX_AGENT_RELAY_TOKEN }}
          CODEX_AGENT_RELAY_URL: ${{ vars.CODEX_AGENT_RELAY_URL }}
          INPUT_TASK_ID: ${{ inputs.taskId }}
        run: node scripts/report-luna-run.mjs

      - name: Install FFmpeg media tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          ffmpeg -hide_banner -version

      - name: Install locked Node dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Bun for Pages build previews
        run: npm install --global bun@1.2.15

      - name: Install headless Chromium for Luna visual previews
        run: npx playwright install --with-deps --only-shell chromium

      - name: Install pinned Codex CLI
        run: npm install --global @openai/codex@0.162.1

      - name: Configure short-lived AWS CLI credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ vars.LUNA_CLI_AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Verify resource CLI tools
        run: |
          aws --version

      - name: Run Luna
        id: run-luna
        env:
          CODEX_AGENT_RELAY_TOKEN: ${{ secrets.CODEX_AGENT_RELAY_TOKEN }}
          CODEX_AGENT_RELAY_URL: ${{ vars.CODEX_AGENT_RELAY_URL }}
          INPUT_TASK_ID: ${{ inputs.taskId }}
          LUNA_TRACE_AWS_REGION: ${{ vars.LUNA_TRACE_AWS_REGION }}
        run: node scripts/codex-cloud-agent.mjs

      - name: Report workflow setup failure or interruption
        if: failure() || cancelled()
        env:
          CODEX_AGENT_RELAY_TOKEN: ${{ secrets.CODEX_AGENT_RELAY_TOKEN }}
          CODEX_AGENT_RELAY_URL: ${{ vars.CODEX_AGENT_RELAY_URL }}
          INPUT_TASK_ID: ${{ inputs.taskId }}
        run: node scripts/report-luna-run.mjs --failed
