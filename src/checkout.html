<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Order Summary</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Order delicious baked goods from Sweet Hope Bakery. Enter your pickup details and pay securely online at checkout.">
        <meta property="og:title" content="Order Request Form - Sweet Hope Bakery">
        <meta property="og:description" content="Order custom cakes, cookies, donuts, and more in Arlington, Virginia. Pay securely online at checkout.">
        <meta property="og:image" content="https://example.com/your-cake-photo.jpg">
        <meta property="og:url" content="https://sweethopebakeryy.com/checkout">
        <link rel="icon" type="image/x-icon" href="/images/sweethopebakeryy.ico">
        <link rel="apple-touch-icon" href="/images/sweethopebakeryy.ico">
        <link rel="canonical" href="https://sweethopebakeryy.com/checkout" />

        <link rel="stylesheet" href="/styles/shared.css">
        <link rel="stylesheet" href="/styles/checkout.css">

        <link rel="preconnect" href="https://js.stripe.com" crossorigin>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body style="background-color:#fdf5e6">
        <div id="header-placeholder"></div>

        <div class="row mx-2 my-4" id="checkout-content">
            <div class="col-md-5 left-side fade-in-right">
                <div class="card">
                    <div class="card-header">
                        <h2>Order Summary</h2>
                    </div>
                    <ul class="list-group list-group-flush" id="order-summary-list">
                        <!-- Injected by checkout.js -->
                    </ul>
                    <div class="card-body">
                        <h5 class="card-title" id="order-total">Total: $0.00</h5>
                    </div>
                </div>
            </div>

            <div class="col-md-1"></div>
            <div class="col-md-5 fade-in-left">
                <form id="checkout-form">
                    <label for="name" class="m-0 p-0">Name</label>
                    <input type="text" name="customer_name" id="name" class="m-0 p-0 mb-2" style="width: 100%" autocomplete="name" maxlength="120" aria-describedby="name-errors" required>
                    <div id="name-errors" class="text-danger" role="status" aria-live="polite"></div>

                    <label for="email" class="m-0 p-0">Email</label>
                    <input type="email" name="customer_email" id="email" class="m-0 p-0 mb-2" style="width: 100%" autocomplete="email" maxlength="254" aria-describedby="email-errors" required>

                    <label for="phone" class="m-0 p-0">Phone Number</label>
                    <input type="tel" name="customer_phone" id="phone" class="m-0 p-0 mb-2" style="width: 100%" autocomplete="tel" maxlength="40" aria-describedby="phone-errors" required>

                    <div id="phone-errors" class="text-danger" role="status" aria-live="polite"></div>
                    <h4 class="m-0 p-0">Pickup Details</h4>
                    <div class="pickup-details-container">
                        <div class="row">
                            <p class="col-md-6">Pickup Location:</p>
                            <h5 class="col-md-6"><strong>Arlington, VA, 22207</strong> </h5>
                        </div>

                        <div class="row">
                            <label for="pickup-date" class="col-md-6">Pickup Date:</label>
                            <input type="date" name="acquisition_date" id="pickup-date" class="col-md-6" autocomplete="off" aria-describedby="pickup-date-errors" required>
                        </div>
                        <div class="row">
                            <div class="col-6 m-0 p-0"></div>
                            <p class="col-6 m-0 p-0 small-text mt-1" style="text-align: end"> * Final pickup time and address to be coordinated through direct communication post-order. </p>
                        </div>
                    </div>
                    <div id="pickup-date-errors" class="text-danger" role="status" aria-live="polite"></div>

                    <input type="hidden" name="acquisition_method" value="pickup">

                    <h4 class="m-0 p-0">Payment Method</h4>
                    <div id="payment-element" aria-label="Payment details"></div>

                    <div id="email-errors" class="text-danger" role="status" aria-live="polite"></div>

                    <button type="submit" id="pay-button" class="btn-cookie btn-lg mt-3">Pay Now</button>
                    <div id="confirm-errors" role="alert" aria-live="assertive"></div>
                </form>
            </div>
        </div>

        <div id="footer-placeholder"></div>

        <script type="module" src="/js/pages/checkout.js"></script>
    </body>
</html>
